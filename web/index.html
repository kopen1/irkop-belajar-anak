<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Belajar Anak - Bermain Sambil Belajar">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Belajar Anak">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <title>Belajar Anak</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237C3AED'/%3E%3Ctext x='50' y='70' font-size='52' text-anchor='middle' fill='white'%3E%E2%AD%90%3C/text%3E%3C/svg%3E">
  <script>var serviceWorkerVersion=null;</script>
  <script src="flutter.js" defer></script>

  <script>
  function _ctx(){return new (window.AudioContext||window.webkitAudioContext)();}
  function speakTTS(text){
    if(!window.speechSynthesis)return;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.rate=0.85;u.pitch=1.15;u.lang="id-ID";
    window.speechSynthesis.speak(u);
  }
  function stopTTS(){if(window.speechSynthesis)window.speechSynthesis.cancel();}

  function playCorrectSfx(){
    var c=_ctx();
    [523,659,784].forEach(function(f,i){
      var o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.frequency.value=f;o.type="sine";
      g.gain.setValueAtTime(0.25,c.currentTime+i*0.12);
      g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+i*0.12+0.22);
      o.start(c.currentTime+i*0.12);o.stop(c.currentTime+i*0.12+0.25);
    });
  }
  function playWrongSfx(){
    var c=_ctx(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.frequency.value=220;o.type="sawtooth";
    g.gain.setValueAtTime(0.12,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+0.3);
    o.start();o.stop(c.currentTime+0.35);
  }
  function playYaySfx(){
    var c=_ctx();
    [523,659,784,1047].forEach(function(f,i){
      var o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.frequency.value=f;o.type="triangle";
      g.gain.setValueAtTime(0.2,c.currentTime+i*0.1);
      g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+i*0.1+0.35);
      o.start(c.currentTime+i*0.1);o.stop(c.currentTime+i*0.1+0.4);
    });
  }
  function playClickSfx(){
    var c=_ctx(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.frequency.value=800;o.type="sine";
    g.gain.setValueAtTime(0.1,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+0.06);
    o.start();o.stop(c.currentTime+0.08);
  }
  </script>
</head>
<body>
  <script>
    window.addEventListener("load",function(ev){
      _flutter.loader.loadEntrypoint({
        onEntrypointLoaded:async function(engineInitializer){
          let appRunner=await engineInitializer.initializeEngine({useColorEmoji:true});
          await appRunner.runApp();
        }
      });
    });
  </script>
</body>
</html>
