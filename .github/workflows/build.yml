name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
      - run: flutter pub get
      - name: Patch compileSdk to 35
        run: sed -i 's/compileSdk 34/compileSdk 35/' android/app/build.gradle
      - run: |
          flutter build apk --release \
          --target-platform android-arm64 \
          --obfuscate \
          --split-debug-info=build/symbols
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk belajar-anak-v1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: belajar-anak-release
          path: belajar-anak-v1.0.0.apk

  deploy-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"
      - run: flutter pub get
      - run: flutter build web --release --base-href "/irkop-belajar-anak/"
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
